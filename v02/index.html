<style>

2;stroke-width:8;opacity:.15;filter:drop-shadow(0 0 9px #0bbdff)}.echo{fill:#aff8ff;filter:drop-shadow(0 0 5px #39dfff);opacity:0;transition:opacity .2s}.echo.on{opacity:.48;animation:echoPulse 1.8s ease-in-out infinite}.echo.boost{animation-duration:.55s;filter:drop-shadow(0 0 9px #39dfff)}@keyframes echoPulse{0%,100%{opacity:.3}50%{opacity:.58}}.echo.attached{fill:#ffe38a;filter:drop-shadow(0 0 8px #ffb83e)}.radar-label{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-size:9px;white-space:nowrap;text-shadow:0 0 5px #001}.readout{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 10px}.metric{text-align:center;border-right:1px solid #10354b}.metric:last-child{border:0}.metric .label{font-size:9px;color:#568aa0}.metric .value{font-size:18px;color:var(--cyan);margin-top:4px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px #08789a}.metric .value small{font-size:10px;color:#47819b}.status{min-height:42px;display:flex;align-items:center;justify-content:center;gap:9px;color:#b8e4ef;font-size:12px;letter-spacing:.09em}.status .pip{width:5px;height:5px;background:var(--amber);opacity:.9}.controls{margin-top:auto;padding-top:12px}.button-row{display:flex;gap:8px}.button{border:1px solid #24627a;background:#071827;color:#b9eaff;padding:12px 10px;font:inherit;font-size:12px;letter-spacing:.08em;min-height:44px}.button.primary{flex:1;background:#0b3145;border-color:#3a9db8;color:#d1f8ff}.button.secondary{color:#9bc6d6;background:#05111c}.button:active{background:#104662}.button:disabled{opacity:.7}.hint{font-size:10px;color:#527586;text-align:center;line-height:1.6;margin:9px 0 0}.sim{border:1px solid #17455c;background:#04111c;padding:11px;margin-top:11px}.sim-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#81aebf}.sim-head strong{font-size:13px;color:#bdefff;font-weight:500}.sim input{width:100%;margin:13px 0 4px;accent-color:#4dc6e4;height:20px}.sim-foot{display:flex;justify-content:space-between;color:#4a6f80;font-size:9px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.switchline{display:flex;align-items:center;gap:7px;font-size:10px;color:#84aaba}.switchline input{accent-color:#4dc6e4;width:16px;height:16px}.archive-link{border:0;background:none;color:#acbdad;font:inherit;font-size:11px;padding:8px 0;letter-spacing:.1em}.archive{display:none;position:fixed;inset:0;z-index:5;background:#02080e;padding:calc(18px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));overflow:auto}.archive.open{display:block}.archive-inner{max-width:440px;margin:auto}.archive-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.archive h2{font-size:17px;font-weight:500;letter-spacing:.12em;margin:0}.close{font-size:22px;line-height:1;color:#aeeafa;border:0;background:none;padding:4px 8px}.section-title{font-size:10px;letter-spacing:.19em;color:#4b8eaa;margin:22px 0 11px}.timeline{border-left:1px solid #28718c;margin-left:4px;padding-left:15px}.event{position:relative;padding:0 0 16px;color:#b7dce7;font-size:12px;line-height:1.6}.event:before{content:"";position:absolute;left:-19px;top:5px;width:6px;height:6px;background:#67d4ec}.event time{display:block;color:#6090a2;font-size:10px}.fragment{border:1px solid #17455c;background:#061522;padding:13px;margin-bottom:9px}.fragment .fmeta{font-size:9px;color:#69a4b8;letter-spacing:.1em;margin-bottom:7px}.fragment h3{font-size:13px;font-weight:500;margin:0 0 7px;color:#d1f2fa}.fragment p{margin:0;color:#9cbdc8;font-size:12px;line-height:1.7}.empty{font-size:12px;color:#718075;line-height:1.8}.quiet-note{color:#536257;font-size:10px;text-align:center;margin:20px 0}.contact-flash{animation:contact .6s ease-out 2}.audio-state{font-size:10px;color:#73a9bd;text-align:center;margin:8px 0 0}.sim-head label{display:flex;align-items:center;gap:7px}.sim-head input{accent-color:#4dc6e4;width:16px;height:16px;margin:0}.sensor-row{display:flex;gap:8px;align-items:center;margin-top:9px}.sensor-row .button{flex:0 0 auto}.sensor-note{font-size:10px;color:#6692a3;line-height:1.4}@keyframes contact{50%{filter:brightness(1.35)}}@keyframes interference{0%,100%{opacity:1}50%{opacity:var(--flicker-alpha,.2)}}.radar-wrap.attached{animation:interference var(--flicker-ms,180ms) steps(2,end) infinite}.radar-wrap.interference-off{animation:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}@media(max-height:740px){.radar-wrap{width:min(78vw,330px);margin-top:13px}.readout{padding:8px 0}.controls{padding-top:7px}}

<body>
<main class="app" id="app">
<header class="top"><div><div class="eyebrow">随行监测 · 07</div><h1>驾驶陪伴｜未知追踪者</h1></div><div class="live" id="inputBadge">模拟待机</div></header>
<div class="radar-wrap" id="radarWrap" aria-label="360度全圆追踪显示"><svg class="radar" viewBox="0 0 300 300" role="img" aria-label="360度蓝色距离刻度、扫描束与回波"><g id="headingLayer"><g id="arcs"></g><g id="ticks"></g></g><g id="cardinalLabels"></g><g id="scanLayer"><path class="beam-tail" d="M150 150L150 30"/><path class="beam" d="M150 150L150 30"/></g><circle id="echo" class="echo" cx="150" cy="150" r="3"/></svg><div class="radar-label"><span id="direction">方向 —</span> · 360°扫描</div></div>
<section class="readout" aria-label="信号读数"><div class="metric"><div class="label">距离</div><div class="value" id="distance">— <small>米</small></div></div><div class="metric"><div class="label">信号</div><div class="value" id="strength">— <small>%</small></div></div><div class="metric"><div class="label">干扰</div><div class="value" id="interference">低</div></div></section>
<div class="status" aria-live="polite"><span class="pip"></span><span id="statusText">等待开始</span></div>
<div class="controls"><div class="button-row"><button class="button primary" id="startBtn">开始 · 解锁音频</button><button class="button secondary" id="testSoundBtn">测试声音</button><button class="button secondary" id="archiveBtn">档案</button></div><div class="audio-state" id="audioState">音频：未启动</div><p class="hint">听不到请关闭静音键并调高音量。请勿在驾驶中查看或操作屏幕；声音可随时关闭。</p>
<div class="sim"><div class="sim-head"><label><input id="simMode" type="checkbox" checked>模拟模式</label><strong><span id="speedNum">32</span> km/h</strong></div><input id="speedSlider" type="range" min="0" max="120" value="32" aria-label="模拟车速"><div class="sim-foot"><span>静止</span><span>120 km/h</span></div></div>
<div class="toolbar"><label class="switchline"><input id="fastMode" type="checkbox" checked>快速循环 · 约 1–2 分钟</label><label class="switchline"><input id="soundToggle" type="checkbox" checked>声音</label></div><div class="sensor-row"><button class="button secondary" id="sensorBtn">启用动作感应</button><span class="sensor-note" id="sensorStatus">当前依赖模拟加速度；传感器在 ATTACHED 时影响逃脱；航向用于定位回波。</span></div><div class="sim"><div class="sim-head"><span>设备航向</span><strong id="headingValue">0°</strong></div><input id="heading" type="range" min="0" max="359" value="0" aria-label="模拟设备航向"><div class="sensor-note" id="headingStatus">航向：模拟航向</div></div><div class="toolbar"><label class="switchline"><input id="flickerToggle" type="checkbox">强干扰闪烁（默认关闭）</label><label class="switchline">幅度 <input id="flickerAmount" type="range" min="0" max="70" value="35" aria-label="闪烁幅度"></label></div></div>
</main>
<section class="archive" id="archive" aria-hidden="true"><div class="archive-inner"><div class="archive-head"><h2>档案</h2><button class="close" id="closeArchive" aria-label="关闭档案">×</button></div><div class="section-title">本次事件</div><div class="timeline" id="timeline"></div><div class="section-title">已收集碎片</div><div id="fragments"></div><p class="quiet-note">记录仅保存在此设备，不含位置或行驶轨迹。</p></div></section>
<script>
(()=>{'use strict';
const FRAGMENTS=[
{id:'f1',type:'录音转写 · 01',title:'雨里的回声',body:'“……测试员林澄，听得到吗？如果你听见第二次敲击，不要回头。第一次不是我。”背景里有三下很轻的敲门声。'},
{id:'f2',type:'残缺文字 · 02',title:'值班簿边页',body:'凌晨 02:14，旧隧道北口。林澄的车已经离开，但探测器上的第二个光点还在向出口移动。值班员拒绝签字。'},
{id:'f3',type:'通信记录 · 03',title:'频道 6',body:'“你说有东西跟着你？”\n“不是跟着我。它在跟着那段录音。”\n“录音里是谁？”\n……载波中断。'},
{id:'f4',type:'维修单 · 04',title:'反向脉冲',body:'M314 原型机回收后，记录到一组与扫描完全同步的脉冲。工程师备注：信号源位于机舱内部。备注被整页划去。'},
{id:'f5',type:'未署名便笺 · 05',title:'最后一班',body:'如果这台机器又亮了，说明我没能把它留在隧道里。林澄不在名单上。请把她的名字从明天的排班表删掉。'}
];
const $=id=>document.getElementById(id),els={audioState:$('audioState'),testSound:$('testSoundBtn'),simMode:$('simMode'),badge:$('inputBadge'),distance:$('distance'),strength:$('strength'),interference:$('interference'),status:$('statusText'),echo:$('echo'),start:$('startBtn'),slider:$('speedSlider'),speedNum:$('speedNum'),fast:$('fastMode'),sound:$('soundToggle'),radar:$('radarWrap'),archive:$('archive'),timeline:$('timeline'),fragments:$('fragments'),sensorBtn:$('sensorBtn'),sensorStatus:$('sensorStatus'),heading:$('heading'),headingStatus:$('headingStatus'),headingValue:$('headingValue'),flicker:$('flickerToggle'),flickerAmount:$('flickerAmount')};
const base=(()=>{try{return JSON.parse(localStorage.getItem('m314-companion-v1')||'{}')}catch(_){return {}}})();let saved={...base};let events=Array.isArray(saved.events)?saved.events.slice():[],collected=new Set(Array.isArray(saved.collected)?saved.collected.filter(id=>FRAGMENTS.some(f=>f.id===id)):[]);
let started=false,playerSpeed=32,watchId=null,motionGranted=false,audioCtx=null,master=null,beepTimer=null,state='MISSING',stateStarted=0,distance=null,strength=0,interference='低',angle=45,range=800,relRadial=0,eventsSeed=1928,randomSeed=1928,simAccel=0,simOrientation=0,escapeLoad=0,attachedElapsed=0,gpsFresh=false,lastGpsSpeed=null,lastGpsAt=0,lastFrame=0,clock=0,scanStarted=performance.now(),scanAngle=0,heading=0,headingSource='模拟航向',headingAt=0,headingFresh=false,headingTarget=0,headingSmoothAt=0,headingScreen=0,orientationSource='无数据',scanBoostUntil=0,fastCycle=true,cycleIndex=0,cyclesLeft=0,contactCount=0,attachedLimit=20,elapsedState=0,signalFx=0,lastOrientation=null,audioGestureStatus='PENDING';
function persist(){try{const merged={...saved,collected:[...collected],events};localStorage.setItem('m314-companion-v1',JSON.stringify(merged));saved=merged}catch(_){}}
function now(){return Date.now()}function fmt(t){try{return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t))}catch(_){return new Date(t).toLocaleTimeString()}}
function record(type,detail){events.unshift({time:now(),type,detail});events=events.slice(0,80);persist();renderArchive()}
function addFragment(){let pool=FRAGMENTS.filter(f=>!collected.has(f.id));if(!pool.length)pool=FRAGMENTS;const f=pool[Math.floor(rnd()*pool.length)];collected.add(f.id);record('接触',`记录接触遭遇：${f.title}`);return f}
function rnd(){randomSeed=(1664525*randomSeed+1013904223)>>>0;return randomSeed/4294967296}
function setState(s){state=s;stateStarted=clock;elapsedState=0;els.status.textContent=s;els.echo.classList.toggle('attached',s==='ATTACHED');if(s==='MISSING'){distance=null;strength=0}else if(s==='RETREATING'){if(distance==null)distance=600;strength=45}else if(s==='ATTACHED'){distance=0;strength=100;interference='高';attachedElapsed=0;escapeLoad=0;contactCount++;els.radar.classList.remove('contact-flash');void els.radar.offsetWidth;els.radar.classList.add('contact-flash');addFragment();playContact()}else if(s==='CHASING'){if(distance==null)distance=720;interference='低'}else if(s==='REAPPEARING'){distance=Math.max(160,Math.min(900,distance||420));strength=54;interference='中';record('再次出现','回波重新捕获')}else if(s==='LURKING'){distance=range;strength=25;interference='低';record('出现','远距微弱回波')}renderReadout();renderBlip();updateFlicker()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setTarget(bearing,dist){angle=((bearing%360)+360)%360;range=Math.max(0,dist);distance=dist;renderBlip()}
function setPlayerSpeed(kmh){playerSpeed=clamp(Number(kmh)||0,0,120);els.slider.value=String(Math.round(playerSpeed));els.speedNum.textContent=els.slider.value}
function updateMotion(accel,orientation=0){simAccel=clamp(Math.abs(Number(accel)||0),0,8);simOrientation=clamp(Math.abs(Number(orientation)||0),0,180);signalFx=clamp(signalFx*.55+simAccel*.18+simOrientation/180*.12,0,1);if(state==='ATTACHED'){escapeLoad=clamp(escapeLoad+Math.max(0,simAccel-0.3)*.16+Math.max(0,simOrientation-8)*.0015,0,1)}}
function transition(next){if(state!==next)setState(next)}
function advance(dt){dt=Math.max(0,Math.min(5,Number(dt)||0));clock+=dt;elapsedState+=dt;
 if(state==='MISSING'&&elapsedState>=2){transition('LURKING')}
 else if(state==='LURKING'||state==='CHASING'||state==='REAPPEARING'){
   const kmh=playerSpeed, player=kmh/3.6, theta=angle*Math.PI/180;
   // Relative Cartesian velocity in the vehicle frame. Target's radial speed is +5.5m/s while chasing and -5.5m/s while retreating.
   const targetRadial=state==='LURKING'?0:(state==='RETREATING'?-5.5:5.5), tx=-Math.sin(theta)*targetRadial, ty=Math.cos(theta)*targetRadial+player;
   const x0=Math.sin(theta)*(distance??range),y0=-Math.cos(theta)*(distance??range),x=x0+tx*dt,y=y0+ty*dt;
   const segmentX=x-x0,segmentY=y-y0,segmentLength2=segmentX*segmentX+segmentY*segmentY;
   const closestT=segmentLength2?clamp(-(x0*segmentX+y0*segmentY)/segmentLength2,0,1):0;
   const closest=Math.hypot(x0+closestT*segmentX,y0+closestT*segmentY);
   relRadial=(x*tx+y*ty)/Math.max(1,Math.hypot(x,y));distance=clamp(Math.hypot(x,y),0,2400);angle=((Math.atan2(x,-y)*180/Math.PI)%360+360)%360;strength=clamp(100-distance/12,0,98);interference=distance<350?'中':'低';
   if(state==='CHASING'&&closest<=3){distance=0;transition('ATTACHED')}
   else {
   if(state==='LURKING'&&elapsedState>=2)transition('CHASING');
   else if(state==='CHASING'&&distance<420&&player>20){transition('RETREATING')}
   
   else if(state==='CHASING'&&elapsedState>22){transition('MISSING');record('信号丢失','回波减弱，进入重新捕获阶段')}
   else if(state==='REAPPEARING'&&elapsedState>=2)transition('CHASING');
   }
 }
 else if(state==='RETREATING'){const theta=angle*Math.PI/180,player=playerSpeed/3.6,tx=Math.sin(theta)*5.5,ty=-Math.cos(theta)*5.5+player,x=Math.sin(theta)*(distance??400)+tx*dt,y=-Math.cos(theta)*(distance??400)+ty*dt;relRadial=(x*tx+y*(ty+player))/Math.max(1,Math.hypot(x,y));distance=clamp(Math.hypot(x,y),0,2400);angle=((Math.atan2(x,-y)*180/Math.PI)%360+360)%360;strength=clamp(100-distance/12,0,98);if(relRadial<-.6){transition('REAPPEARING')}else if(elapsedState>=8||distance>=2400){transition('MISSING');cycleIndex++;record('信号丢失','目标远离，回波脱离量程')}}
 else if(state==='ATTACHED'){attachedElapsed+=dt;const quietRecovery=dt*.003;escapeLoad=clamp(escapeLoad-quietRecovery,0,1);if(escapeLoad>=.8){record('脱离','附着信号自行脱离，追踪恢复');distance=190;angle=(angle+183)%360;transition('CHASING')}else if(attachedElapsed>=attachedLimit){record('接触遭遇',`附着持续 ${Math.round(attachedElapsed)} 秒后结束，已记录接触`);transition('MISSING');cycleIndex++}}
 renderReadout();renderBlip();updateFlicker();return snapshot()}
function snapshot(){return {state,distance,strength,angle,playerSpeed,relRadial,escapeLoad,attachedElapsed,events:events.length,fragments:[...collected],cycles:cycleIndex}}
function directionName(a){return ['前方','右前','右侧','右后','后方','左后','左侧','左前'][Math.floor((a+22.5)/45)%8]}
function norm360(a){return ((Number(a)%360)+360)%360}function targetPoint(bearing,dist){const a=norm360(bearing),R=118,rad=a*Math.PI/180,r=clamp(dist,0,1200)/1200*R;return {x:150+Math.sin(rad)*r,y:150-Math.cos(rad)*r,direction:directionName(a),bearing:a}}
function shortestDelta(from,to){return ((to-from+540)%360)-180}function smoothHeading(target,dt){return norm360(headingScreen+shortestDelta(headingScreen,target)*Math.min(1,Math.max(0,dt)*8))}
function updateVisualFrame(ts){const elapsed=(ts-scanStarted)%4000;const oldScan=scanAngle;scanAngle=elapsed/4000*360;const scanStep=norm360(scanAngle-oldScan),targetOffset=norm360(angle+heading-headingScreen-oldScan);if(distance!==null&&state!=='MISSING'&&state!=='RETREATING'&&scanStep>0&&targetOffset<=scanStep)scanBoostUntil=ts+260;$('scanLayer').setAttribute('transform',`rotate(${scanAngle.toFixed(2)} 150 150)`);if(headingFresh&&Date.now()-headingAt>5000){headingFresh=false;headingSource='模拟航向（传感器数据过期）';orientationSource='数据过期';setHeadingValue(Number(els.heading.value)||0);updateHeadingStatus()}const dt=lastVisualFrame?Math.max(0,(ts-lastVisualFrame)/1000):0;lastVisualFrame=ts;headingScreen=smoothHeading(headingTarget,dt);$('headingLayer').setAttribute('transform',`rotate(${-headingScreen.toFixed(2)} 150 150)`);document.querySelectorAll('#cardinalLabels text').forEach((el,i)=>{const a=norm360(i*90-headingScreen)*Math.PI/180;el.setAttribute('x',150+Math.sin(a)*141);el.setAttribute('y',150-Math.cos(a)*141)});renderBlip();if(distance!==null&&state!=='MISSING'&&state!=='RETREATING'&&ts<scanBoostUntil)els.echo.classList.add('boost');else els.echo.classList.remove('boost');requestAnimationFrame(updateVisualFrame)}
let lastVisualFrame=0
function renderBlip(){const worldBearing=norm360(angle+heading),screenBearing=norm360(worldBearing-headingScreen),p=targetPoint(screenBearing,distance??range);els.echo.setAttribute('cx',p.x.toFixed(2));els.echo.setAttribute('cy',p.y.toFixed(2));$('direction').textContent=`方向 ${directionName(norm360(angle))} · ${Math.round(norm360(angle))}°`;els.echo.classList.toggle('on',distance!==null&&state!=='MISSING'&&state!=='RETREATING');}
function renderArcs(){const g=$('arcs'),ticks=$('ticks'),labels=$('cardinalLabels');if(!g)return;for(let ring=1;ring<=4;ring++){const R=ring*27;for(let i=0;i<48;i++){const a=(i/48)*Math.PI*2, a1=a+.006,a2=a+.042;let x1=150+Math.sin(a1)*R,y1=150-Math.cos(a1)*R,x2=150+Math.sin(a2)*R,y2=150-Math.cos(a2)*R;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`);path.setAttribute('class','seg');g.appendChild(path)}}for(let i=0;i<36;i++){const a=i*10*Math.PI/180,r1=i%3===0?124:128,r2=132,x1=150+Math.sin(a)*r1,y1=150-Math.cos(a)*r1,x2=150+Math.sin(a)*r2,y2=150-Math.cos(a)*r2;const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",x1);line.setAttribute("y1",y1);line.setAttribute("x2",x2);line.setAttribute("y2",y2);line.setAttribute("class","ticks");ticks.appendChild(line)}for(let i=0;i<4;i++){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','tick-label');t.setAttribute('x',150+Math.sin(i*Math.PI/2)*141);t.setAttribute('y',150-Math.cos(i*Math.PI/2)*141);t.textContent=String(i*90);labels.appendChild(t)}}
function renderReadout(){els.distance.innerHTML=(distance===null?'—':Math.max(0,Math.round(distance)))+' <small>m</small>';els.strength.innerHTML=Math.round(strength)+' <small>%</small>';els.interference.textContent=interference}
function updateFlicker(){const on=els.flicker.checked&&state==='ATTACHED'&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&Number(els.flickerAmount.value)>0;els.radar.classList.toggle('attached',state==='ATTACHED');els.radar.classList.toggle('interference-off',!on);if(on){els.radar.style.setProperty('--flicker-alpha',String(1-Number(els.flickerAmount.value)/100));els.radar.style.setProperty('--flicker-ms',`${Math.round(350-Number(els.flickerAmount.value)*2.3)}ms`)}}
function updateAudioState(){els.audioState.textContent='音频：'+(audioCtx?audioCtx.state:'不可用')}
function setupAudio(){if(audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){updateAudioState();return}try{audioCtx=new AC();master=audioCtx.createGain();master.gain.value=els.sound.checked?.8:0;master.connect(audioCtx.destination);audioCtx.addEventListener('statechange',updateAudioState);const b=audioCtx.createBuffer(1,Math.max(1,Math.floor(audioCtx.sampleRate*.05)),audioCtx.sampleRate),src=audioCtx.createBufferSource();src.buffer=b;src.connect(master);src.start();updateAudioState()}catch(_){audioCtx=null;updateAudioState()}}
function unlockAudio(){setupAudio();if(audioCtx&&audioCtx.state!=='running')audioCtx.resume().catch(()=>{});updateAudioState()}
function blip(freq,dur,vol,type='sine'){if(!audioCtx||!master||!els.sound.checked)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+dur+.03)}catch(_){}}
function confirmationBeep(){blip(660,.16,.28);setTimeout(()=>blip(880,.18,.28),190)}function playContact(){if(audioCtx&&els.sound.checked)blip(180,.25,.05)}
function renderArchive(){els.timeline.innerHTML='';if(!events.length)els.timeline.innerHTML='<div class="empty">尚无事件。开始后，出现、丢失与接触会在这里留下时间线。</div>';else events.forEach(ev=>{const d=document.createElement('div');d.className='event';const tm=document.createElement('time');tm.textContent=fmt(ev.time);d.append(tm,document.createTextNode(ev.detail));els.timeline.appendChild(d)});els.fragments.innerHTML='';const found=FRAGMENTS.filter(f=>collected.has(f.id));if(!found.length)els.fragments.innerHTML='<div class="empty">尚未回收碎片。</div>';found.forEach(f=>{const card=document.createElement('article');card.className='fragment';const meta=document.createElement('div');meta.className='fmeta';meta.textContent=f.type;const title=document.createElement('h3');title.textContent=f.title;const p=document.createElement('p');p.textContent=f.body;card.append(meta,title,p);els.fragments.appendChild(card)})}
function startGPS(){if(!navigator.geolocation)return;try{watchId=navigator.geolocation.watchPosition(pos=>{const s=pos.coords.speed;if(typeof s==='number'&&Number.isFinite(s)){lastGpsSpeed=Math.max(0,s*3.6);lastGpsAt=now();gpsFresh=true;if(!els.simMode.checked)els.badge.textContent='GPS'}},()=>{gpsFresh=false}, {enableHighAccuracy:true,maximumAge:3000,timeout:12000})}catch(_){}}
function getSpeed(){const fresh=gpsFresh&&now()-lastGpsAt<5000;els.badge.textContent=els.simMode.checked?'模拟滑块':fresh?'GPS':'GPS无效→滑块';return els.simMode.checked?Number(els.slider.value):(fresh?lastGpsSpeed:Number(els.slider.value))}
function onMotion(e){els.sensorStatus.textContent='动作数据已收到；仅影响 ATTACHED 逃脱判定。'+(headingFresh?'':' 航向仍为模拟。');const a=e.acceleration||{},g=e.accelerationIncludingGravity||{};const vals=[a.x,a.y,a.z].filter(v=>Number.isFinite(v));const signal=vals.length?Math.sqrt(vals.reduce((s,v)=>s+v*v,0)):Math.sqrt([g.x,g.y,g.z].filter(Number.isFinite).reduce((s,v)=>s+v*v,0));updateMotion(clamp(vals.length?signal:signal-9.80665,0,8),0)}
function setHeadingValue(h){const next=norm360(h);angle=norm360(angle-shortestDelta(heading,next));heading=next;headingTarget=next;renderBlip()}function screenAngle(){const so=screen.orientation&&Number(screen.orientation.angle);return Number.isFinite(so)?so:(Number(window.orientation)||0)}function normalizeOrientation(e,screen=screenAngle()){if(Number.isFinite(e.webkitCompassHeading))return {heading:norm360(e.webkitCompassHeading),source:'iOS compass heading'};if((e.absolute===true||e.type==='deviceorientationabsolute')&&Number.isFinite(e.alpha))return {heading:norm360(360-e.alpha+screen),source:'absolute DeviceOrientation'};return {heading:null,source:Number.isFinite(e.alpha)?'relative DeviceOrientation (not compass)':'no orientation data'}}function applyOrientation(e,screen=screenAngle()){const n=normalizeOrientation(e,screen);orientationSource=n.source;if(n.heading!==null){setHeadingValue(n.heading);headingAt=Date.now();headingFresh=true;headingSource=n.source;updateHeadingStatus()}else if(n.source!=='no orientation data'){els.headingStatus.textContent=`航向：${n.source}；使用模拟航向`;headingSource=n.source}if(Number.isFinite(e.beta)&&Number.isFinite(e.gamma)){const current={b:e.beta,g:e.gamma};if(lastOrientation){const d1=Math.abs(current.b-lastOrientation.b),d2=Math.abs(current.g-lastOrientation.g);updateMotion(0,Math.min(180,Math.hypot(Math.min(d1,360-d1),Math.min(d2,360-d2))))}lastOrientation=current}return n}function onOrientation(e){applyOrientation(e)}
function updateHeadingStatus(){els.headingStatus.textContent=`航向：${headingSource} · ${headingFresh?Math.max(0,Math.round((Date.now()-headingAt)/1000))+'秒前':'模拟'}`;els.heading.value=String(Math.round(headingFresh?headingTarget:Number(els.heading.value)||0));els.headingValue.textContent=`${els.heading.value}°`}function setHeading(h,source='模拟航向'){setHeadingValue(h);headingScreen=headingTarget;headingFresh=source!=='模拟航向';headingSource=source;orientationSource=source;headingAt=Date.now();updateHeadingStatus();renderBlip()}
async function requestSensors(){try{const ME=window.DeviceMotionEvent,DO=window.DeviceOrientationEvent;if(ME&&typeof ME.requestPermission==='function'&&(await ME.requestPermission())!=='granted')throw new Error('motion permission denied');if(DO&&typeof DO.requestPermission==='function'&&(await DO.requestPermission())!=='granted')throw new Error('orientation permission denied');if(ME)window.addEventListener('devicemotion',onMotion,{passive:true});if(DO){window.addEventListener('deviceorientation',onOrientation,{passive:true});window.addEventListener('deviceorientationabsolute',onOrientation,{passive:true})}motionGranted=!!(ME||DO);els.sensorStatus.textContent=motionGranted?'传感器监听已启用；等待实际数据，监听本身不代表数据已到达。':'设备未提供动作/姿态传感器；继续使用模拟模式。';if(!headingFresh)els.headingStatus.textContent='航向：等待绝对航向数据 · 当前使用模拟航向';}catch(_){els.sensorStatus.textContent='动作/航向传感器不可用或未授权；继续使用模拟模式。'}}
function start(){if(started)return;unlockAudio();confirmationBeep();started=true;els.start.textContent='运行中 · 被动扫描';els.start.disabled=true;requestSensors();startGPS();record('开始','被动扫描已启动');setState('MISSING');tick()}
function tick(){if(!started)return;playerSpeed=getSpeed();advance(Math.min(.1,Math.max(0,(now()-lastFrame)/1000||.05)));lastFrame=now();soundLoop();requestAnimationFrame(tick)}
function soundLoop(){clearTimeout(beepTimer);if(!started)return;if(state!=='ATTACHED'&&els.sound.checked){const interval=state==='MISSING'?2300:Math.max(480,1500-Math.max(0,1000-(distance||0))*.6);blip(state==='MISSING'?370:560,.07,.06);beepTimer=setTimeout(soundLoop,interval)}}
els.start.addEventListener('click',start);els.slider.addEventListener('input',()=>{playerSpeed=Number(els.slider.value);els.speedNum.textContent=els.slider.value;if(els.simMode.checked)els.badge.textContent='模拟滑块'});els.simMode.addEventListener('change',()=>{getSpeed()});els.sound.addEventListener('change',()=>{if(master)master.gain.value=els.sound.checked?.8:0});els.testSound.addEventListener('click',e=>{if(e.isTrusted)audioGestureStatus='VALIDATED';unlockAudio();confirmationBeep()});els.sensorBtn.addEventListener('click',requestSensors);els.flicker.addEventListener('change',updateFlicker);els.flickerAmount.addEventListener('input',updateFlicker);$('archiveBtn').addEventListener('click',()=>{renderArchive();els.archive.classList.add('open');els.archive.setAttribute('aria-hidden','false')});$('closeArchive').addEventListener('click',()=>{els.archive.classList.remove('open');els.archive.setAttribute('aria-hidden','true')});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audioCtx&&audioCtx.state!=='running')audioCtx.resume().catch(()=>{});updateAudioState()});
renderArcs();renderArchive();renderReadout();requestAnimationFrame(updateVisualFrame);els.heading.addEventListener('input',()=>{if(!headingFresh){setHeadingValue(Number(els.heading.value)||0);headingSource='模拟航向';updateHeadingStatus()}});
const visualPreview=new URLSearchParams(location.search).get('visual');
if(visualPreview==='attached'){setState('ATTACHED',{distance:0,angle:55,seed:314});els.badge.textContent='静态预览 · ATTACHED';els.start.textContent='开始实时扫描'}
if(visualPreview==='chasing'){setState('CHASING',{distance:520,angle:68,playerSpeed:32});els.badge.textContent='静态预览 · CHASING';els.start.textContent='开始实时扫描'}
// Narrow test seam: same engine, state transitions, renderers and storage used by the UI.
if(location.search.includes('testApi=1'))Object.defineProperty(window,'M314Test',{value:Object.freeze({
 setState(s,o={}){if(o.distance!==undefined)distance=o.distance;if(o.angle!==undefined)angle=o.angle;if(o.range!==undefined)range=o.range;if(o.playerSpeed!==undefined)setPlayerSpeed(o.playerSpeed);if(o.seed!==undefined)randomSeed=o.seed>>>0;if(o.attachedLimit!==undefined)attachedLimit=o.attachedLimit;if(o.clock!==undefined)clock=o.clock;setState(s);return snapshot()},
 step:advance,motion:updateMotion,setSpeed:setPlayerSpeed,setTarget,getPoint:targetPoint,snapshot,
 storage(){return JSON.parse(localStorage.getItem('m314-companion-v1')||'{}')},
 load(){const x=JSON.parse(localStorage.getItem('m314-companion-v1')||'{}');saved={...x};events=Array.isArray(x.events)?x.events.slice():[];collected=new Set(Array.isArray(x.collected)?x.collected.filter(id=>FRAGMENTS.some(f=>f.id===id)):[]);persist();renderArchive();return {saved,events:[...events],collected:[...collected]}},
 reset(){saved={};events=[];collected=new Set();persist();renderArchive();return true},
 fragments:FRAGMENTS.map(x=>({...x})),getSpeed,requestSensors,
 getAudioStatus(){return {state:audioCtx?audioCtx.state:'not-created',trustedGesture:audioGestureStatus}},isStarted(){return started},
 setHeading,normalizeOrientation,feedOrientation(e,screen){return applyOrientation(e,screen)},
 setWorldTarget(bearing,dist){angle=norm360(bearing-heading);distance=dist;range=dist;renderBlip();return {worldBearing:norm360(bearing),relativeBearing:angle,point:targetPoint(norm360(bearing-headingScreen),dist)}},
 getVisual(){return {scanAngle,scanPeriodMs:4000,heading:headingScreen,source:headingSource,fresh:headingFresh,echoOpacity:getComputedStyle(els.echo).opacity,backgroundAnimation:getComputedStyle(els.radar).animationName,beamTransform:$('scanLayer').getAttribute('transform'),blip:{x:+els.echo.getAttribute('cx'),y:+els.echo.getAttribute('cy')}}}
})});
