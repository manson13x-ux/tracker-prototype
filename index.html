<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080d0b">
<title>驾驶陪伴｜未知追踪者</title>
<style>
:root{color-scheme:dark;--bg:#080d0b;--panel:#0c1511;--line:#263c2e;--green:#91c99a;--dim:#63836c;--amber:#d4a75d;--text:#d4dfd5;--muted:#829087;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100svh;padding:calc(12px + var(--safe-top)) 18px calc(14px + var(--safe-bottom));background:radial-gradient(ellipse at 50% 35%,#101b14 0,#080d0b 62%);letter-spacing:.04em}.app{max-width:440px;margin:auto;min-height:calc(100svh - var(--safe-top) - var(--safe-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--dim)}h1{font-size:18px;font-weight:500;letter-spacing:.12em;margin:5px 0 0}.live{font-size:10px;color:var(--green);border:1px solid #38543d;border-radius:99px;padding:6px 9px;white-space:nowrap}.live:before{content:"";display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%;margin:0 6px 1px 0;opacity:.8}.radar-wrap{position:relative;width:min(86vw,350px);aspect-ratio:1;margin:19px auto 7px}.radar{width:100%;height:100%;overflow:visible}.ring{fill:none;stroke:#294333;stroke-width:1}.cross{stroke:#22382a;stroke-width:.8}.sweep{transform-origin:150px 150px;animation:spin 6s linear infinite}.sweep path{fill:url(#fan);stroke:#91c99a;stroke-width:.8;opacity:.78}.echo{fill:#d6b267;filter:drop-shadow(0 0 5px #c9a354);opacity:0;transition:opacity .7s}.echo.on{opacity:.95}.echo-halo{fill:#d6b267;opacity:0}.echo.on+.echo-halo{animation:echo 2.8s ease-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes echo{0%{r:3;opacity:.5}100%{r:17;opacity:0}}.radar-label{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:9px;color:#58715d;letter-spacing:.2em}.readout{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 12px}.metric{text-align:center;border-right:1px solid #1e3025}.metric:last-child{border:0}.metric .label{font-size:9px;color:var(--muted);letter-spacing:.13em}.metric .value{font-size:16px;color:var(--green);margin-top:4px;font-variant-numeric:tabular-nums}.metric .value small{font-size:10px;color:var(--dim)}.status{min-height:46px;display:flex;align-items:center;justify-content:center;gap:9px;color:#adbbaf;font-size:12px;letter-spacing:.09em}.status .pip{width:5px;height:5px;background:var(--amber);border-radius:50%;opacity:.8}.controls{margin-top:auto;padding-top:14px}.button-row{display:flex;gap:9px}.button{border:1px solid #415847;background:#142019;color:#c5d6c8;border-radius:8px;padding:13px 15px;font:inherit;font-size:13px;letter-spacing:.1em;min-height:46px}.button.primary{flex:1;background:#263c2c;border-color:#5c8162;color:#d9e9d9}.button.secondary{color:#a4b2a6;background:#0d1510}.button:active{background:#334b37}.hint{font-size:10px;color:#627167;text-align:center;line-height:1.6;margin:10px 0 0}.sim{border:1px solid #293a2d;border-radius:9px;background:#0b120e;padding:12px;margin-top:12px}.sim-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9aad9d}.sim-head strong{font-size:13px;color:#c6d7c7;font-weight:500}.sim input{width:100%;margin:14px 0 4px;accent-color:#91bd8f;height:20px}.sim-foot{display:flex;justify-content:space-between;color:#56675b;font-size:9px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.switchline{display:flex;align-items:center;gap:7px;font-size:11px;color:#8d9d90}.switchline input{accent-color:#9bbb8f;width:16px;height:16px}.archive-link{border:0;background:none;color:#acbdad;font:inherit;font-size:11px;padding:8px 0;letter-spacing:.1em}.archive{display:none;position:fixed;inset:0;z-index:5;background:#080d0b;padding:calc(18px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));overflow:auto}.archive.open{display:block}.archive-inner{max-width:440px;margin:auto}.archive-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.archive h2{font-size:17px;font-weight:500;letter-spacing:.12em;margin:0}.close{font-size:22px;line-height:1;color:#aebcaf;border:0;background:none;padding:4px 8px}.section-title{font-size:10px;letter-spacing:.19em;color:#738777;margin:22px 0 11px}.timeline{border-left:1px solid #405745;margin-left:4px;padding-left:15px}.event{position:relative;padding:0 0 16px;color:#c4d0c5;font-size:12px;line-height:1.6}.event:before{content:"";position:absolute;left:-19px;top:5px;width:6px;height:6px;border-radius:50%;background:#96b091}.event time{display:block;color:#75877a;font-size:10px;font-variant-numeric:tabular-nums}.fragment{border:1px solid #283b2d;background:#0c1510;border-radius:8px;padding:13px;margin-bottom:9px}.fragment .fmeta{font-size:9px;color:#8eaa91;letter-spacing:.1em;margin-bottom:7px}.fragment h3{font-size:13px;font-weight:500;margin:0 0 7px;color:#d1ddcf}.fragment p{margin:0;color:#9caa9d;font-size:12px;line-height:1.7}.empty{font-size:12px;color:#718075;line-height:1.8}.quiet-note{color:#536257;font-size:10px;text-align:center;margin:20px 0}.contact-flash{animation:contact .6s ease-out 2}.audio-state{font-size:10px;color:#8ca38f;text-align:center;margin:8px 0 0}.sim-head label{display:flex;align-items:center;gap:7px}.sim-head input{accent-color:#9bbb8f;width:16px;height:16px;margin:0}@keyframes contact{50%{filter:brightness(1.35)}}@media(max-height:740px){.radar-wrap{width:min(75vw,290px);margin-top:10px}.readout{padding:8px 0}.controls{padding-top:8px}}
</style>
</head>
<body>
<main class="app" id="app">
<header class="top"><div><div class="eyebrow">随行监测 · 07</div><h1>驾驶陪伴｜未知追踪者</h1></div><div class="live" id="inputBadge">模拟待机</div></header>
<div class="radar-wrap" id="radarWrap" aria-label="动态雷达"><svg class="radar" viewBox="0 0 300 300" role="img" aria-label="绿色扇形雷达扫描，一个未知信号点"><defs><radialGradient id="fan"><stop offset="0" stop-color="#8dc891" stop-opacity=".03"/><stop offset="1" stop-color="#8dc891" stop-opacity=".25"/></radialGradient></defs><circle class="ring" cx="150" cy="150" r="42"/><circle class="ring" cx="150" cy="150" r="84"/><circle class="ring" cx="150" cy="150" r="126"/><path class="cross" d="M24 150h252M150 24v252M61 61l178 178M239 61 61 239"/><g class="sweep"><path d="M150 150 L150 24 A126 126 0 0 1 213 41 Z"/></g><circle id="echo" class="echo" cx="232" cy="83" r="3"/><circle class="echo-halo" cx="232" cy="83" r="3"/></svg><div class="radar-label">被动扫描 · 不记录路线</div></div>
<section class="readout" aria-label="信号读数"><div class="metric"><div class="label">距离</div><div class="value" id="distance">— <small>米</small></div></div><div class="metric"><div class="label">信号</div><div class="value" id="strength">— <small>%</small></div></div><div class="metric"><div class="label">干扰</div><div class="value" id="interference">低</div></div></section>
<div class="status" aria-live="polite"><span class="pip"></span><span id="statusText">等待开始</span></div>
<div class="controls"><div class="button-row"><button class="button primary" id="startBtn">开始 · 解锁音频</button><button class="button secondary" id="testSoundBtn">测试声音</button><button class="button secondary" id="archiveBtn">档案</button></div><div class="audio-state" id="audioState">音频：未启动</div><p class="hint">听不到请关闭静音键并调高音量。请勿在驾驶中查看或操作屏幕；声音可随时关闭。</p>
<div class="sim"><div class="sim-head"><label><input id="simMode" type="checkbox" checked>模拟模式</label><strong><span id="speedNum">32</span> km/h</strong></div><input id="speedSlider" type="range" min="0" max="120" value="32" aria-label="模拟车速"><div class="sim-foot"><span>静止</span><span>120 km/h</span></div></div>
<div class="toolbar"><label class="switchline"><input id="fastMode" type="checkbox" checked>快速模式 · 约 1–2 分钟</label><label class="switchline"><input id="soundToggle" type="checkbox" checked>声音</label></div></div>
</main>
<section class="archive" id="archive" aria-hidden="true"><div class="archive-inner"><div class="archive-head"><h2>档案</h2><button class="close" id="closeArchive" aria-label="关闭档案">×</button></div><div class="section-title">本次事件</div><div class="timeline" id="timeline"></div><div class="section-title">已收集碎片</div><div id="fragments"></div><p class="quiet-note">记录仅保存在此设备，不含位置或行驶轨迹。</p></div></section>
<script>
(()=>{'use strict';
const FRAGMENTS=[
{id:'f1',type:'录音转写 · 01',title:'雨里的回声',body:'“……测试员林澄，听得到吗？如果你听见第二次敲击，不要回头。第一次不是我。”背景里有三下很轻的敲门声。'},
{id:'f2',type:'残缺文字 · 02',title:'值班簿边页',body:'凌晨 02:14，旧隧道北口。林澄的车已经离开，但探测器上的第二个光点还在向出口移动。值班员拒绝签字。'},
{id:'f3',type:'通信记录 · 03',title:'频道 6',body:'“你说有东西跟着你？”\n“不是跟着我。它在跟着那段录音。”\n“录音里是谁？”\n……载波中断。'},
{id:'f4',type:'维修单 · 04',title:'反向脉冲',body:'M314 原型机回收后，记录到一组与扫描完全同步的脉冲。工程师备注：信号源位于机舱内部。备注被整页划去。'},
{id:'f5',type:'未署名便笺 · 05',title:'最后一班',body:'如果这台机器又亮了，说明我没能把它留在隧道里。林澄不在名单上。请把她的名字从明天的排班表删掉。'}
];
const $=id=>document.getElementById(id), els={audioState:$('audioState'),testSound:$('testSoundBtn'),simMode:$('simMode'),badge:$('inputBadge'),distance:$('distance'),strength:$('strength'),interference:$('interference'),status:$('statusText'),echo:$('echo'),start:$('startBtn'),slider:$('speedSlider'),speedNum:$('speedNum'),fast:$('fastMode'),sound:$('soundToggle'),radar:$('radarWrap'),archive:$('archive'),timeline:$('timeline'),fragments:$('fragments')};
let started=false, mode='sim', playerSpeed=32, speedSamples=[], lastSpeedAt=0, watchId=null, motionGranted=false, audioCtx=null, master=null, beepTimer=null, stateTimer=null, state='静默', stateStarted=0, contactAt=0, nextEventAt=0, distance=0, strength=0, interference='低', events=[], collected=new Set(), motionSeen=0, gpsSeen=false, lastGpsAt=0, lastGpsSpeed=null, lastFrame=0;
const saved=(()=>{try{return JSON.parse(localStorage.getItem('m314-companion-v1')||'{}')}catch(_){return {}}})();if(Array.isArray(saved.collected))collected=new Set(saved.collected.filter(id=>FRAGMENTS.some(f=>f.id===id)));if(Array.isArray(saved.events))events=saved.events;
function persist(){try{localStorage.setItem('m314-companion-v1',JSON.stringify({collected:[...collected],events}))}catch(_){}}
function now(){return Date.now()}function fmt(t){try{return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t))}catch(_){return new Date(t).toLocaleTimeString()}}
function setStatus(s){state=s;els.status.textContent=s}
function record(type,detail){events.unshift({time:now(),type,detail});events=events.slice(0,80);persist();renderArchive()}
function addFragment(){let pool=FRAGMENTS.filter(f=>!collected.has(f.id));if(!pool.length)pool=FRAGMENTS;const f=pool[Math.floor(Math.random()*pool.length)];collected.add(f.id);persist();record('接触',`回收到故事碎片：${f.title}`);els.status.textContent=`接触 · ${f.title}`;return f}
function rand(min,max){return min+Math.random()*(max-min)}
function transition(next){if(state===next)return;clearTimeout(stateTimer);state=next;stateStarted=now();switch(next){case'静默':distance=0;strength=0;els.echo.classList.remove('on');setStatus('静默扫描');nextEventAt=now()+cycleDuration();break;case'远处出现':distance=rand(780,1120);strength=Math.round(rand(17,32));els.echo.classList.add('on');record('出现','远处出现微弱回波');setStatus('远处出现');stateTimer=setTimeout(()=>transition('缓慢跟随'),els.fast.checked?12000:rand(18000,30000));break;case'缓慢跟随':setStatus('缓慢跟随');stateTimer=setTimeout(()=>transition('突然接近'),els.fast.checked?20000:rand(30000,50000));break;case'突然接近':setStatus('信号接近');stateTimer=setTimeout(()=>transition('信号丢失'),els.fast.checked?14000:rand(20000,35000));break;case'信号丢失':els.echo.classList.remove('on');interference='高';setStatus('信号丢失 · 重新捕获中');record('信号丢失','回波中断，伴有低沉干扰');stateTimer=setTimeout(()=>transition('再次出现'),els.fast.checked?8000:rand(12000,22000));break;case'再次出现':els.echo.classList.add('on');interference='中';distance=rand(90,230);strength=Math.round(rand(62,83));setStatus('再次出现');record('再次出现','近距离回波重新捕获');stateTimer=setTimeout(()=>transition('接触'),els.fast.checked?18000:rand(25000,40000));break;case'接触':contactAt=now();els.radar.classList.remove('contact-flash');void els.radar.offsetWidth;els.radar.classList.add('contact-flash');distance=0;strength=100;interference='高';els.echo.classList.remove('on');addFragment();playContact();stateTimer=setTimeout(()=>{interference='低';transition('静默')},3800);break}}
function cycleDuration(){return els.fast.checked?rand(30000,42000):rand(45000,75000)}
function scheduleCycle(){if(!started)return;nextEventAt=now()+cycleDuration()}
function tick(){if(!started)return;const t=now(), elapsed=(t-stateStarted)/1000, gpsFresh=lastGpsSpeed!==null&&t-lastGpsAt<5000, avg=els.simMode.checked?Number(els.slider.value):(gpsFresh?lastGpsSpeed:Number(els.slider.value));playerSpeed=avg;els.badge.textContent=els.simMode.checked?'模拟滑块':gpsFresh?'GPS':'GPS无效→滑块';
if(state==='静默'&&t>=nextEventAt)transition('远处出现');
if(state==='远处出现'||state==='缓慢跟随'||state==='突然接近'||state==='再次出现'){
 const phase=state==='远处出现'?Math.min(1,elapsed/12):state==='缓慢跟随'?Math.min(1,elapsed/20):state==='突然接近'?Math.min(1,elapsed/14):Math.min(1,elapsed/18);const startDist=state==='远处出现'?950:state==='缓慢跟随'?760:state==='突然接近'?460:180;distance=Math.max(state==='再次出现'?28:90,startDist-phase*(startDist-(state==='再次出现'?28:110)));
 strength=Math.max(4,Math.min(98,Math.round(100-distance/12))); interference=state==='远处出现'?'中':state==='突然接近'?'中':'低';

}
if(state==='信号丢失'){interference='高';distance=null;strength=0}
if(state==='接触'){distance=0;strength=100}
renderReadout();lastFrame=requestAnimationFrame(tick)}
function renderReadout(){els.distance.innerHTML=(distance===null?'—':Math.max(0,Math.round(distance)))+' <small>米</small>';els.strength.innerHTML=Math.round(strength)+' <small>%</small>';els.interference.textContent=interference;els.interference.style.color=interference==='高'?'#c69d61':'#91c99a'}
function updateAudioState(){if(els.audioState)els.audioState.textContent='音频：'+(audioCtx?audioCtx.state:'不可用')}
function setupAudio(){if(audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){updateAudioState();return}try{audioCtx=new AC();master=audioCtx.createGain();master.gain.value=els.sound.checked?.8:0;master.connect(audioCtx.destination);audioCtx.addEventListener('statechange',updateAudioState);const b=audioCtx.createBuffer(1,Math.max(1,Math.floor(audioCtx.sampleRate*.05)),audioCtx.sampleRate),src=audioCtx.createBufferSource();src.buffer=b;src.connect(master);src.start();updateAudioState()}catch(_){audioCtx=null;updateAudioState()}}
function unlockAudio(){setupAudio();if(audioCtx&&audioCtx.state!=='running')audioCtx.resume().catch(()=>{});updateAudioState()}
function blip(freq,dur,vol,type='sine'){if(!audioCtx||!master||!els.sound.checked)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+dur+.03)}catch(_){}}
function confirmationBeep(){blip(660,.16,.28);setTimeout(()=>blip(880,.18,.28),190)}
function soundLoop(){clearTimeout(beepTimer);if(!started)return;let interval=state==='静默'?2600:state==='信号丢失'?1700:Math.max(420,1600-Math.max(0,1200-distance)*.72);if(state==='接触')interval=0;if(state==='信号丢失'){blip(95,.16,.055,'triangle');}else if(state!=='接触'){let f=state==='静默'?370:420+Math.max(0,1100-distance)*.62;blip(Math.min(1050,f),.075,.085)}if(interval)beepTimer=setTimeout(soundLoop,interval)}
function playContact(){if(!audioCtx||!els.sound.checked)return;blip(180,.25,.08,'sine');setTimeout(()=>blip(145,.28,.055,'sine'),280)}
function startGPS(){if(!navigator.geolocation)return;try{watchId=navigator.geolocation.watchPosition(pos=>{const s=pos.coords.speed;if(typeof s==='number'&&Number.isFinite(s)){lastGpsSpeed=Math.max(0,s*3.6);lastGpsAt=now();gpsSeen=true;if(!els.simMode.checked)els.badge.textContent='GPS';}},()=>{if(!gpsSeen)els.badge.textContent='模拟模式'}, {enableHighAccuracy:true,maximumAge:3000,timeout:12000})}catch(_){}}
function askMotion(){if(!window.DeviceMotionEvent)return;const req=DeviceMotionEvent.requestPermission;if(typeof req==='function'){req.call(DeviceMotionEvent).then(result=>{if(result==='granted'){motionGranted=true;window.addEventListener('devicemotion',onMotion,{passive:true})}}).catch(()=>{})}else{try{window.addEventListener('devicemotion',onMotion,{passive:true});motionGranted=true}catch(_){}}}
function onMotion(e){const a=e.accelerationIncludingGravity;if(a&&[a.x,a.y,a.z].some(v=>typeof v==='number'))motionSeen=now()}
function renderArchive(){els.timeline.innerHTML='';if(!events.length)els.timeline.innerHTML='<div class="empty">尚无事件。开始后，出现、丢失与接触会在这里留下时间线。</div>';else events.forEach(ev=>{const d=document.createElement('div');d.className='event';const tm=document.createElement('time');tm.textContent=fmt(ev.time);d.append(tm,document.createTextNode(ev.detail));els.timeline.appendChild(d)});els.fragments.innerHTML='';const found=FRAGMENTS.filter(f=>collected.has(f.id));if(!found.length)els.fragments.innerHTML='<div class="empty">尚未回收碎片。每一次接触都会带来一枚。</div>';found.forEach(f=>{const card=document.createElement('article');card.className='fragment';const meta=document.createElement('div');meta.className='fmeta';meta.textContent=f.type;const title=document.createElement('h3');title.textContent=f.title;const p=document.createElement('p');p.textContent=f.body;card.append(meta,title,p);els.fragments.appendChild(card)})}
els.start.addEventListener('click',()=>{if(started)return;unlockAudio();confirmationBeep();started=true;askMotion();startGPS();els.start.textContent='运行中 · 被动扫描';els.start.disabled=true;els.badge.textContent=els.simMode.checked?'模拟滑块':'GPS无效→滑块';record('开始','被动扫描已启动');scheduleCycle();stateStarted=now();tick();soundLoop()});
els.slider.addEventListener('input',()=>{playerSpeed=Number(els.slider.value);els.speedNum.textContent=els.slider.value;if(els.simMode.checked)els.badge.textContent='模拟滑块'});els.simMode.addEventListener('change',()=>{els.badge.textContent=els.simMode.checked?'模拟滑块':(lastGpsSpeed!==null&&now()-lastGpsAt<5000?'GPS':'GPS无效→滑块')});
els.fast.addEventListener('change',()=>{if(started&&state==='静默')scheduleCycle()});els.sound.addEventListener('change',()=>{if(master)master.gain.value=els.sound.checked?.8:0;if(started)soundLoop()});els.testSound.addEventListener('click',()=>{unlockAudio();confirmationBeep()});document.addEventListener('pointerdown',unlockAudio,{passive:true});document.addEventListener('touchend',unlockAudio,{passive:true});$('archiveBtn').addEventListener('click',()=>{renderArchive();els.archive.classList.add('open');els.archive.setAttribute('aria-hidden','false')});$('closeArchive').addEventListener('click',()=>{els.archive.classList.remove('open');els.archive.setAttribute('aria-hidden','true')});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audioCtx&&audioCtx.state!=='running')audioCtx.resume().catch(()=>{});updateAudioState()});renderArchive();renderReadout();
})();
</script>
</body>
</html>
